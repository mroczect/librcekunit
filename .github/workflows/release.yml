name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --release --all-features

      - name: Run tests (release)
        run: cargo test --workspace --release --all-features

      - name: Create source archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix=librcekunit-${TAG}/ \
            -o librcekunit-${TAG}.tar.gz HEAD

      - name: Checksum
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sha256sum librcekunit-${TAG}.tar.gz > librcekunit-${TAG}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            librcekunit-*.tar.gz
            librcekunit-*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            librcekunit-*.tar.gz
            librcekunit-*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
