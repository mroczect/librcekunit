name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and release
    runs-on: docker
    container:
      image: docker.io/rust:1.96-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-

      - name: Install native deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake perl ca-certificates

      - name: Build release
        run: cargo build --workspace --release --all-features

      - name: Run tests (release)
        run: cargo test --workspace --release --all-features

      - name: Create source archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix=librcekunit-${TAG}/ \
            -o librcekunit-${TAG}.tar.gz HEAD

      - name: Checksum
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sha256sum librcekunit-${TAG}.tar.gz > librcekunit-${TAG}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            librcekunit-*.tar.gz
            librcekunit-*.sha256
          if-no-files-found: error

      - name: Create Forgejo release
        uses: actions/gitea-release-action@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            librcekunit-*.tar.gz
            librcekunit-*.sha256
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            See the [CHANGELOG](CHANGELOG.md) for details.
          draft: false
          prerelease: false
