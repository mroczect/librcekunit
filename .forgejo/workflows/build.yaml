name: Rust CI (Stable)

on:
  push:
    branches: ["main", "stable"]
  pull_request:
    branches: ["main", "stable"]
  workflow_dispatch:  # bisa dijalankan manual

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    runs-on: docker
    container:
      image: rust:latest  # bisa ganti ke rust:stable jika perlu
    timeout-minutes: 30   # tambahkan timeout agar tidak hang

    steps:
      # 1. Install system dependencies (Node.js hanya jika diperlukan)
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm
          rm -rf /var/lib/apt/lists/*

      # 2. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Cache Cargo registry (menghemat waktu build)
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: /usr/local/cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # 4. Cache target folder
      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # 5. Pastikan menggunakan Rust stable (opsional, image rust:latest sudah stable)
      - name: Set up Rust toolchain
        run: |
          rustup default stable
          rustup component add clippy rustfmt

      # 6. Build (debug)
      - name: Build (debug)
        run: cargo build --verbose

      # 7. Jalankan tes
      - name: Run tests
        run: cargo test --verbose

      # 8. Build release
      - name: Build release
        run: cargo build --release --verbose

      # 9. Linting dengan clippy (opsional, untuk stabilitas kode)
      - name: Run clippy
        run: cargo clippy -- -D warnings

      # 10. Format check
      - name: Check formatting
        run: cargo fmt -- --check

      # 11. Upload artefak (hanya untuk branch 'main' atau 'stable')
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: librcekunit-release
          path: target/release/
          if-no-files-found: error
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'